<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>K2000 Industrial Trend UI</title>
<style>
html,body{margin:0;background:#111;color:#bbb;font:13px monospace}body{display:flex;gap:18px;padding:18px}canvas{border:1px solid #444;image-rendering:pixelated}.side{width:330px}label{display:block;margin:8px 0}input{background:#222;color:#fff;border:1px solid #555;padding:4px}.note{color:#777;line-height:1.5}.fb{width:160px;height:480px}</style>
</head>
<body>
<div><canvas id="panel" width="960" height="320"></canvas><p>逻辑显示 960×320</p><canvas class="fb" id="fb" width="320" height="960"></canvas></div>
<div class="side"><h2>Keithley 2000 工业趋势预览</h2>
<label>读数 <input id="reading" value="+03.68900"></label>
<label>单位 <input id="unit" value="V"></label>
<label><input id="overflow" type="checkbox"> OVERFLOW</label>
<label><input id="demo" type="checkbox"> Demo 动态档位轮换</label>
<p class="note">完整设计预设包含 10V AUTO、MOVING 10 与 GPIB 16；这些是仿真场景输入，不代表面板协议能够提供这些字段。</p>
</div>
<script src="font_data.js"></script>
<script>
"use strict";
const UI_W=960,UI_H=320;
 const L={statusY:0,statusH:24,readingY:24,readingH:168,trendY:192,trendH:128,readingX:12,infoRight:940,infoX:760,infoNameW:72,infoRowH:32,infoZinY:40,infoRangeY:72,infoRateY:104,infoStatusY:136,chartPanelY:192,chartPanelH:128,plotDividerY:192,plotDividerH:4,plotX:96,plotY:196,plotW:600,plotH:92,plotBgY:196,plotBgH:92,yAxisX:0,yAxisW:96,yAxisY:192,yAxisH:128,xAxisX:96,xAxisW:600,xAxisY:296,xAxisH:24,statsX:760,statsW:180,statsNameW:72,statsRowH:30,statsRangeY:196,statsMaxY:226,statsMinY:256,statsAvgY:286};
const COLORS={bg:"#000",bar:"#182126",bar2:"#263238",green:"#00ff33",greenDim:"#006c25",cyan:"#00d9ff",white:"#fff",muted:"#5d666b",grid:"#263238",red:"#f22"};
const X_LABELS=["10.00s","7.50s","5.00s","2.50s","0.00s"];
const STATUS=["REM","TALK","LSTN","SRQ","BUFFER: IDLE (1024 MAX)","GPIB: 16","CONT","TRIG"];
function textBitmap(c){const symbols={"µ":0,"Ω":1,"°":2,"±":3};if(Object.hasOwn(symbols,c))return SYMBOL_BITMAPS[symbols[c]];const n=c.charCodeAt(0);return n<TEXT_FIRST||n>TEXT_LAST?null:TEXT_BITMAPS[n-TEXT_FIRST]}
function digitBitmap(c){const syms={"µ":0,"°":1,"Ω":2};if(Object.hasOwn(syms,c))return DIGIT_SYMBOL_BITMAPS[syms[c]];const i=DIGIT_CHARS.indexOf(c);return i<0?null:DIGIT_BITMAPS[i]}
function halfBitmap(c){const i=HALF_CHARS.indexOf(c);return i<0?null:HALF_BITMAPS[i]}
function normalizeUnit(s){return (s||"").replace("MVDC","mVDC").replace("MVAC","mVAC").replace("MADC","mADC").replace("MAAC","mAAC").replace("KOHM","k\u03A9").replace("MOHM","M\u03A9").replace("OHM","\u03A9")}
function glyph(ctx,b,w,h,bpr,x,y,color){if(!b)return;ctx.fillStyle=color;for(let r=0;r<h;r++)for(let c=0;c<w;c++)if(b[r*bpr+(c>>3)]&(0x80>>(c&7)))ctx.fillRect(x+c,y+r,1,1)}
function text(ctx,s,x,y,color){for(const c of s){glyph(ctx,textBitmap(c),TEXT_W,TEXT_H,TEXT_BPR,x,y,color);x+=TEXT_W}}
function digits(ctx,s,x,y,color){for(const c of s){glyph(ctx,digitBitmap(c),DIGIT_W,DIGIT_H,DIGIT_BPR,x,y,color);x+=DIGIT_W}}
function half(ctx,s,x,y,color){for(const c of s){glyph(ctx,halfBitmap(c),HALF_W,HALF_H,HALF_BPR,x,y,color);x+=HALF_W}}
function deterministicTrace(i){const t=i/239;const rc=3.35+0.42*(1-Math.exp(-t*5));const saw=((i%48)/48-.5)*.065;return rc+saw}
function traceData(){return Array.from({length:240},(_,i)=>deterministicTrace(i))}
function renderFB(ctx,source){const src=source.getImageData(0,0,960,320).data,img=ctx.createImageData(320,960);for(let y=0;y<320;y++)for(let x=0;x<960;x++){const s=(y*960+x)*4,d=(x*320+y)*4;img.data[d]=src[s];img.data[d+1]=src[s+1];img.data[d+2]=src[s+2];img.data[d+3]=255}ctx.putImageData(img,0,0)}
function render(){
 const canvas=document.getElementById("panel"),ctx=canvas.getContext("2d");ctx.fillStyle=COLORS.bg;ctx.fillRect(0,0,960,320);
 ctx.fillStyle=COLORS.bar;ctx.fillRect(0,L.statusY,960,L.statusH);
 let x=10;STATUS.forEach((s,i)=>{text(ctx,s,x,0,i===4||i===5?COLORS.white:COLORS.green);x+=s.length*12+18});
const overflow=document.getElementById("overflow").checked;const value=overflow?"OVERFLOW":document.getElementById("reading").value;const unit=normalizeUnit(document.getElementById("unit").value);
  const color=overflow?COLORS.red:COLORS.green;
  let base=unit,suffix="";
  if(unit.length>=3&&unit.endsWith("DC")){base=unit.slice(0,-2);suffix="DC"}
  else if(unit.length>=3&&unit.endsWith("AC")){base=unit.slice(0,-2);suffix="AC"}
  const ry=L.readingY+(L.readingH-DIGIT_H)/2;
  let dx=L.readingX;digits(ctx,value,dx,ry,color);dx+=value.length*DIGIT_W;
  digits(ctx,base,dx,ry,color);dx+=base.length*DIGIT_W;
  if(suffix)half(ctx,suffix,dx,ry+DIGIT_BASELINE-HALF_BASELINE,color);
  const infoX=L.infoX,infoNameW=L.infoNameW,infoRowH=L.infoRowH,valueX=infoX+infoNameW,valueW=L.infoRight-valueX,infoY=[L.infoZinY,L.infoRangeY,L.infoRateY,L.infoStatusY];
  const cell=(name,val,vc,ci)=>{ctx.fillStyle=COLORS.bar;ctx.fillRect(infoX,ci,infoNameW,infoRowH);ctx.fillStyle=COLORS.bar2;ctx.fillRect(valueX,ci,valueW,infoRowH);text(ctx,name,infoX,ci+(infoRowH-TEXT_H)/2,vc);text(ctx,val,valueX,ci+(infoRowH-TEXT_H)/2,vc)};
  cell("Zin",demo.on?"--":"--",COLORS.muted,infoY[0]);
  cell("Range",demo.on?demo.rangeVal:"AUTO",COLORS.white,infoY[1]);
  cell("Rate",demo.on?demo.rateVal:"500 Read/s",COLORS.white,infoY[2]);
  ctx.fillStyle=COLORS.bar;ctx.fillRect(infoX,infoY[3],infoNameW,infoRowH);ctx.fillStyle=COLORS.bar2;ctx.fillRect(valueX,infoY[3],valueW,infoRowH);text(ctx,"Status",infoX,infoY[3]+(infoRowH-TEXT_H)/2,COLORS.white);
  const lamp=(on)=>on?COLORS.green:COLORS.muted;
  text(ctx,"FILT",valueX,infoY[3]+(infoRowH-TEXT_H)/2,lamp(demo.on?demo.filt:true));
  text(ctx,"REL",valueX+4*TEXT_W,infoY[3]+(infoRowH-TEXT_H)/2,lamp(demo.on?demo.rel:true));
  text(ctx,"MATH",valueX+8*TEXT_W,infoY[3]+(infoRowH-TEXT_H)/2,lamp(demo.on?demo.math:true));
  ctx.fillStyle=COLORS.bar;ctx.fillRect(0,L.chartPanelY,UI_W,L.chartPanelH);
  ctx.fillStyle=COLORS.bg;ctx.fillRect(L.plotX,L.plotBgY,L.plotW,L.plotBgH);
  ctx.fillStyle=COLORS.bar2;ctx.fillRect(L.plotX,L.plotDividerY,L.plotW,L.plotDividerH);ctx.fillRect(L.plotX,L.plotY,L.plotW,1);ctx.fillRect(L.plotX+L.plotW-1,L.plotY,1,L.plotH);
   ctx.strokeStyle=COLORS.grid;ctx.setLineDash([3,4]);for(let i=0;i<4;i++){const y=L.plotY+i*L.plotH/3;ctx.beginPath();ctx.moveTo(L.plotX,y);ctx.lineTo(L.plotX+L.plotW,y);ctx.stroke()}for(let i=0;i<5;i++){const xx=L.plotX+i*L.plotW/4;ctx.beginPath();ctx.moveTo(xx,L.plotY);ctx.lineTo(xx,L.plotY+L.plotH);ctx.stroke()}ctx.setLineDash([]);
   // 统计栏悬浮样式（与读数区信息栏同款，64px 隔趋势图，Range 灰色同 Zin）
   {const sx=L.statsX,sw=L.statsW,sn=L.statsNameW,sv=sx+sn,vw=sw-sn,sh=L.statsRowH,ys=[L.statsRangeY,L.statsMaxY,L.statsMinY,L.statsAvgY],names=["Range","MAX","MIN","AVG"],vals=[demo.on?demo.rangeVal:"AUTO","1.20V","0.90V","1.10V"];for(let i=0;i<4;i++){ctx.fillStyle=COLORS.bar;ctx.fillRect(sx,ys[i],sn,sh);ctx.fillStyle=COLORS.bar2;ctx.fillRect(sv,ys[i],vw,sh);text(ctx,names[i],sx,ys[i]+(sh-TEXT_H)/2,i==0?COLORS.muted:COLORS.white);text(ctx,vals[i],sv,ys[i]+(sh-TEXT_H)/2,i==0?COLORS.muted:COLORS.white)}}
   const data=(demo.on&&demo.trend.length>1)?demo.trend:traceData(),lo=Math.min(...data),hi=Math.max(...data),rawSpan=hi-lo,span=rawSpan>0?rawSpan:Math.max(Math.abs(hi)*.02,0.000001),pad=span*.1,ylo=lo-pad,yhi=hi+pad;
  const axisUnit=demo.on?demoAxisUnit():"V";
  /* Demo samples are already in the displayed unit; target samples are
     normalized internally before the shared formatter applies this scale. */
  const axisScale=1;
  const niceStep=(span)=>{let s=span/3,p=1;while(s>=10){s/=10;p*=10}while(s<1){s*=10;p/=10}return (s<=1?p:s<=2?2*p:s<=5?5*p:10*p)};
  const scaledLo=ylo*axisScale,scaledHi=yhi*axisScale,step=niceStep(scaledHi-scaledLo),top=Math.ceil(scaledHi/step)*step;
  const fmtAxis=(v)=>Math.abs(v)>=100?v.toFixed(0):Math.abs(v)>=10?v.toFixed(1):Math.abs(v)>=1?v.toFixed(2):v.toFixed(3);
   for(let i=0;i<4;i++){const s=fmtAxis(top-step*i)+axisUnit;const x=Math.max(0,Math.min(L.plotX-s.length*TEXT_W-4,L.plotX-4-s.length*TEXT_W));text(ctx,s,x,L.plotY+i*L.plotH/3-10,COLORS.cyan)}
  X_LABELS.forEach((s,i)=>{const center=L.plotX+i*L.plotW/4;const x=Math.max(L.plotX,Math.min(L.plotX+L.plotW-s.length*TEXT_W,center-s.length*TEXT_W/2));text(ctx,s,x,L.xAxisY,COLORS.cyan)});
 for(const [color,dy] of [[COLORS.greenDim,-1],[COLORS.greenDim,1],[COLORS.green,0]]){ctx.strokeStyle=color;ctx.beginPath();data.forEach((v,i)=>{const px=L.plotX+i*(L.plotW-1)/239,py=L.plotY+(yhi-v)/(yhi-ylo)*L.plotH+dy;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke()}
 renderFB(document.getElementById("fb").getContext("2d"),ctx);
}
const DEMO_UNITS=[
  {unit:"VDC",int:2,frac:5,lo:20000,hi:1250000,s9:0x10,s8:0x04},
  {unit:"VAC",int:3,frac:5,lo:20000,hi:7000000,s9:0x30,s8:0x02},
  {unit:"ADC",int:2,frac:5,lo:10000,hi:300000,s9:0x10,s8:0x01},
  {unit:"AAC",int:2,frac:5,lo:10000,hi:300000,s9:0x40,s8:0x12},
  {unit:"mVDC",int:3,frac:5,lo:10000,hi:100000,s9:0x30,s8:0x04},
  {unit:"mVAC",int:3,frac:5,lo:10000,hi:100000,s9:0x10,s8:0x01},
  {unit:"mADC",int:2,frac:5,lo:10000,hi:200000,s9:0x50,s8:0x04},
  {unit:"mAAC",int:2,frac:5,lo:10000,hi:200000,s9:0x30,s8:0x02},
  {unit:"OHM",int:4,frac:4,lo:1000,hi:2000000,s9:0x10,s8:0x02},
  {unit:"kOHM",int:3,frac:4,lo:1000,hi:1000000,s9:0x50,s8:0x01},
  {unit:"MOHM",int:3,frac:4,lo:1000,hi:1000000,s9:0x30,s8:0x0c},
  {unit:"Hz",int:3,frac:3,lo:1000,hi:1000000,s9:0x10,s8:0x04},
  {unit:"kHz",int:3,frac:3,lo:1000,hi:1000000,s9:0x00,s8:0x14},
  {unit:"MHz",int:2,frac:3,lo:1000,hi:50000,s9:0x40,s8:0x02},
  {unit:"°CEL",int:2,frac:3,lo:1000,hi:50000,s9:0x30,s8:0x01},
];
const DEMO_UNIT_COUNT=DEMO_UNITS.length,DEMO_SAMPLES_PER_UNIT=40,DEMO_FEED_PERIOD_MS=100;
const DEMO_RATE_TEXT={0x04:"500 Read/s",0x02:"50 Read/s",0x01:"5 Read/s"};
const demo={on:false,timer:null,sample:0,rangeVal:"AUTO",rateVal:"500 Read/s",filt:false,rel:false,math:false,trend:[]};
function demoPad(v,d){return String(v).padStart(d,"0")}
function demoAxisUnit(){const u=document.getElementById("unit").value;const b=u.replace(/(DC|AC)$/,"");if(b.includes("V"))return "V";if(b.includes("A"))return "A";if(b.includes("Ω"))return "Ω";if(b.endsWith("Hz"))return "Hz";if(b.includes("°"))return "°C";if(b.includes("s"))return "s";return ""}
function demoStep(){
 const u=DEMO_UNITS[Math.floor(demo.sample/DEMO_SAMPLES_PER_UNIT)%DEMO_UNIT_COUNT];
 const ph=demo.sample%DEMO_SAMPLES_PER_UNIT,tri=(ph<DEMO_SAMPLES_PER_UNIT/2?ph:DEMO_SAMPLES_PER_UNIT-ph)*2;
 const div=10**u.frac,mant=u.lo+Math.round((u.hi-u.lo)*tri/DEMO_SAMPLES_PER_UNIT);
const value="+"+demoPad(Math.floor(mant/div),u.int)+"."+demoPad(mant%div,u.frac);
  document.getElementById("reading").value=value;
  document.getElementById("unit").value=normalizeUnit(u.unit);
  demo.rangeVal=(u.s9&0x10)?"AUTO":"MANUAL";
  demo.rateVal=DEMO_RATE_TEXT[u.s8&0x07]||"-- Read/s";
 demo.filt=!!(u.s9&0x20);demo.rel=!!(u.s9&0x40);
 demo.math=Math.floor(demo.sample/DEMO_SAMPLES_PER_UNIT)%4===3;
 demo.trend.push(parseFloat(value));
 if(demo.trend.length>240)demo.trend.shift();
 demo.sample++;render();
}
function toggleDemo(){
 demo.on=!demo.on;
 if(demo.on){demo.timer=setInterval(demoStep,DEMO_FEED_PERIOD_MS);demoStep()}
 else{clearInterval(demo.timer);demo.timer=null;render()}
}
if(typeof document!=="undefined"){document.querySelectorAll("input").forEach(e=>e.addEventListener("input",render));document.getElementById("demo").addEventListener("change",toggleDemo);render()}
</script>
</body></html>
